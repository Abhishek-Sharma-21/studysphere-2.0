name: Branch and PR Validation

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-branch:
    name: Validate Branch Rules
    runs-on: ubuntu-latest

    steps:
      - name: Validate source and target branches
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          echo "Source branch: $SOURCE"
          echo "Target branch: $TARGET"

          if [[ "$TARGET" == "dev" && "$SOURCE" == feature/* ]]; then
            echo "Valid feature PR to dev"
          elif [[ "$TARGET" == "main" && "$SOURCE" == "dev" ]]; then
            echo "Valid dev PR to main"
          else
            echo "::error::Invalid branch combination: $SOURCE -> $TARGET"
            exit 1
          fi
